<div class="admin-login-page">
  <div class="admin-login-card">
    <a class="admin-login-brand" routerLink="/">
      <img src="images/logo.svg" width="40" height="40" alt="" />
      <span>Lumen CMS</span>
    </a>

    <h1>Admin sign in</h1>
    <p class="admin-login-sub">Manage articles and newsletter content.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="username" placeholder="admin@lumen.health" />
      </label>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
      </label>

      @if (error()) {
        <p class="admin-error" role="alert">{{ error() }}</p>
      }

      <button class="btn btn-primary" type="submit" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
