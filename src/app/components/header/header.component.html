<header class="site-header" [class.is-scrolled]="scrolled()">
  <div class="container header-inner">
    <a class="brand" routerLink="/" fragment="top" aria-label="Lumen home">
      <img class="brand-logo" src="images/logo.svg" width="36" height="36" alt="" />
      <span>Lumen</span>
    </a>

    <button
      class="nav-toggle"
      type="button"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="navOpen()"
      (click)="toggleNav()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>

    <nav class="nav-links" [class.is-open]="navOpen()" aria-label="Primary navigation">
      <a routerLink="/" fragment="about" routerLinkActive="is-active" (click)="closeNav()">About</a>
      <a routerLink="/" fragment="topics" routerLinkActive="is-active" (click)="closeNav()">Topics</a>
      <a routerLink="/" fragment="posts" routerLinkActive="is-active" (click)="closeNav()">Posts</a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" (click)="toggleTheme()">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      </button>
      <div class="nav-cta">
        <a class="btn btn-primary btn-sm" routerLink="/" fragment="subscribe" (click)="closeNav()">Subscribe</a>
      </div>
    </nav>
  </div>
</header>
